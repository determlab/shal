name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A quiet repo gets no CI at all: between 2026-07-19 and 2026-08-28 nothing was
  # pushed, nothing ran, and a stale green badge covered a broken
  # `pip install "pyshal[mcp]"` for 34 days (#105/#106). Time-based runs decouple
  # "is the published package still installable" from "did anyone commit".
  # 06:17 UTC Monday — deliberately off the hour and off midnight; GitHub's
  # scheduler is most congested at :00 and at 00:00 UTC and delays runs there.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: python -m pytest --cov=shal --cov-report=term-missing

  examples:
    # Keep examples/ alive: a src/shal change that breaks a demo or the
    # generation benchmark fails CI here instead of rotting silently.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Driver-creator benchmark (4 cases, generated drivers vs harness)
        run: python examples/driver-creator/run_benchmark.py
      - name: Registry manifests in sync with drivers (re-emit -> no diff)
        run: |
          python examples/driver-creator/emit_manifest.py
          git diff --exit-code -- 'examples/**/device.yaml' 'examples/**/metadata.yaml'
      - name: Demos run headless
        run: |
          python examples/demos/sonos/demo_sim.py
          python examples/demos/deebot/demo_sim.py
          python examples/demos/mesh/demo_mesh.py
      - name: Example drivers pass their tests where they live (#149)
        # the four vendor drivers that left the wheel (the pca9548 chip's tests
        # stay in tests/, importing it from examples/drivers/pca9548);
        # testpaths=tests keeps them out of the core run, so they run here
        run: python -m pytest examples/drivers

  arena:
    # SHAL Arena's own package (arena/, issue #310): a separate distribution with
    # its own pyproject.toml, so root `testpaths = ["tests"]` never runs it —
    # without this job CI would be green on an arena regression. Installs pyshal
    # from this checkout (editable) first so shal-arena's `pyshal>=0.4.0,<0.5`
    # dependency resolves to this commit, not a PyPI release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pyshal (editable, this commit) then shal-arena
        run: |
          pip install -e .
          pip install -e "./arena[dev]"
          # separate from the dev extra on purpose, same reasoning as this
          # workflow's own `packaging`/`build` jobs: test_packaging.py builds
          # a real wheel (issue #313 CTO review — package-data only showed up
          # missing there, never from this job's own editable install) and
          # needs the `build` frontend to do it.
          pip install build
      - name: Lint
        run: ruff check arena/src arena/tests
      - name: Test
        run: python -m pytest arena/tests -q

  packaging:
    # Checks the *built wheel's* metadata, not the source that declares it
    # (#123). `test`/`examples` install `.[dev]` from a repo checkout, so a
    # bad `Requires-Dist` has never once been exercised: pyshal 0.2.1 shipped
    # `mcp>=1.0` with no upper bound, and `pip install "pyshal[mcp]"` broke
    # on every fresh install for 34 days while every test stayed green
    # (#105/#106) — because no test ever installed the wheel.
    #
    # The clean-venv wheel install already lives in `build` below: it
    # installs the wheel with no extras into a fresh venv and runs the CLI.
    # This job does not repeat that — it's a static check of the wheel's
    # METADATA against what src/shal actually imports, so it needs no venv
    # of its own; see dev/packaging/check_dist.py for the two things it
    # checks and why.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          pip install build twine packaging
          python -m build
      - name: twine check — wheel metadata is well-formed
        run: twine check dist/*
      - name: Declared deps vs. what src/shal actually imports at module scope, and bound coverage
        run: python dev/packaging/check_dist.py dist

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build
      - name: sdist excludes examples/, tests/ and dev/ (the test approver must never ship, #78)
        run: |
          tar tzf dist/*.tar.gz | grep -E '/(examples|tests|dev)/' && exit 1 || echo "clean"
      - name: Wheel smoke — install the built wheel clean and run the CLI
        run: |
          python -m venv /tmp/ws
          /tmp/ws/bin/pip install "$(ls dist/*.whl)"
          /tmp/ws/bin/shal --help
          /tmp/ws/bin/shal docs | head -1
          /tmp/ws/bin/shal-mcp --help > /dev/null
          # the in-package agent guide must ship (the self-sufficiency promise, #55)
          /tmp/ws/bin/python -c "from importlib.resources import files; assert (files('shal')/'AGENT_GUIDE.md').is_file(), 'AGENT_GUIDE.md missing from the wheel'"
          # D1 (#149): a fresh wheel registers only shal,* — and the ADK reference
          # set ships as guide material, printable with `shal docs --example`
          /tmp/ws/bin/python -c "import shal; c = shal.catalog(); bad = [e['compatible'] for e in c['drivers'] + c['buses'] if not e['compatible'].startswith('shal,')]; assert not bad, bad"
          /tmp/ws/bin/shal docs --list
          /tmp/ws/bin/shal docs --example tmp102 | grep -q "==== topology.yaml"
      - name: agenticQA release-acceptance — cold-install the sdist + drive the gate (sim, #78)
        run: python dev/eval/agenticqa/run.py --all --from-tarball "$(ls dist/*.tar.gz)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  quickstart:
    # The README's Quick Start, run exactly as printed, the way a stranger runs
    # it (#159): a clean venv with nothing in it, then the README's own blocks,
    # in order. The job keeps no copy of the commands — dev/quickstart/run_readme.py
    # reads them out of README.md, so the words the CMO writes are the words
    # tested. It fails when a block exits non-zero (or not with the code the
    # README states) or prints something other than the README shows; only the
    # drifting sensor reading is matched by pattern (see the script's docstring).
    #
    # The one substitution: the README's `pip install pyshal` runs as printed
    # with `pyshal` replaced by the wheel built from this commit — otherwise
    # this job would test PyPI, not the PR. The seconds from that pip install
    # to the first successful read go into the job summary.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel from this commit
        run: |
          pip install build
          python -m build --wheel
      - name: Clean venv (no dev deps, nothing installed)
        run: python -m venv "${{ runner.temp }}/quickstart-venv"
      - name: README Quick Start, as printed (pip line installs this commit's wheel)
        run: python dev/quickstart/run_readme.py --venv "${{ runner.temp }}/quickstart-venv" --dist dist

  references:
    # The ADK reference set is guide material a cold agent copies (#153, ADK
    # §3.6 / R7): a reference that quietly gains a warning teaches the wrong
    # pattern to every agent that copies it. So every change runs
    # `shal check driver:<Class> --topology topology.yaml --json` in each
    # reference folder, the way an operator would, and fails on any problem OR
    # warning (stricter than `shal check`'s own exit code, which counts only
    # problems). The set is found by listing the folder (every subfolder with
    # a driver.py), never a hard-coded list — see dev/adk/check_references.py.
    #
    # It checks what ships: the folders under site-packages/shal/adk/reference
    # in a clean venv holding the wheel built from this commit, not src/.
    # Both OSes, as the quickstart job: each is one wheel build and six short
    # checks, and a Windows path or line-ending break in a shipped reference
    # would otherwise reach a Windows user first.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel from this commit
        run: |
          pip install build
          python -m build --wheel
      - name: Clean venv with only the wheel installed
        shell: bash
        run: |
          python -m venv "${{ runner.temp }}/references-venv"
          "${{ runner.temp }}/references-venv/${{ runner.os == 'Windows' && 'Scripts' || 'bin' }}/python" -m pip install dist/*.whl
      - name: shal check on every installed reference (fails on any problem or warning)
        run: python dev/adk/check_references.py --venv "${{ runner.temp }}/references-venv"

  samples:
    # The samples are for a person deciding whether SHAL does their job (#206);
    # one that no longer runs from a fresh install tells them no. So every change
    # runs every sample the way a person would: `shal docs --sample <name> --to
    # DIR`, then the one command it prints, with stdin an empty pipe (not
    # DEVNULL: on Windows that is NUL, which isatty() calls a terminal, so a
    # gated op would prompt instead of being refused). A sample fails on a
    # non-zero exit, unless its folder's expect.json names the exit (and the
    # output) it must end with. The set comes from `shal docs --samples --json`,
    # which lists the installed folder — never a hard-coded list; see
    # dev/samples/run_samples.py.
    #
    # It runs what ships: a clean venv holding the wheel built from this commit,
    # as the references and quickstart jobs do. Both OSes, for the same reason.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel from this commit
        run: |
          pip install build
          python -m build --wheel
      - name: Clean venv with only the wheel installed
        shell: bash
        run: |
          python -m venv "${{ runner.temp }}/samples-venv"
          "${{ runner.temp }}/samples-venv/${{ runner.os == 'Windows' && 'Scripts' || 'bin' }}/python" -m pip install dist/*.whl
      - name: Run every installed sample from a scratch folder (fails on an unexpected exit)
        run: python dev/samples/run_samples.py --venv "${{ runner.temp }}/samples-venv" --scratch "${{ runner.temp }}/samples-scratch"

  latest-deps:
    # Upstream canary (#106). The `test` job installs `.[dev]`, which honours the
    # declared ceilings (`mcp>=1.0,<2` since #107) — so it can never see the next
    # major, which is exactly the class of break that hit users in #105. This job
    # deliberately steps past every ceiling and runs the suite against whatever
    # PyPI ships today, so an upstream major release fails our build instead of
    # only failing a fresh `pip install`.
    #
    # Not in the required-checks list on purpose: an upstream major breaking is
    # news, not a broken PR, and nobody in this repo caused it. It is also gated to
    # scheduled/manual runs so it never paints a red X on an unrelated PR.
    #
    # Deliberately NOT `continue-on-error: true`. That would keep the workflow run
    # green, which means no red run on the Actions tab and no failure email — a
    # canary nobody looks at is worth nothing, and this issue exists precisely
    # because a green signal hid a real break. The cost of that choice is honest:
    # the scheduled run goes red for something no contributor did, and someone has
    # to triage it. Not being a required check is what keeps that from blocking work.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install shal without resolving its pins
        # --no-deps so pip never applies pyproject's ceilings to the next step.
        run: pip install --no-deps -e .
      - name: Install dependencies unpinned (latest on PyPI today)
        run: pip install --upgrade pyyaml jsonschema mcp pytest pytest-cov
      - name: Resolved versions
        run: pip list
      - name: MCP SDK imports at all (the suite below would skip, not fail)
        # tests/test_mcp_server.py:5 is `pytest.importorskip("mcp")` — correct for
        # the normal suite, where `mcp` is an optional extra. Here it is a hole: if
        # a future major breaks plain `import mcp`, every MCP test SKIPS and the
        # canary reports green — the exact false-green #106 exists to prevent. So
        # assert it hard here, before pytest runs. Not fixed by editing the test.
        run: |
          python -c "import mcp, mcp.types, mcp.server, mcp.server.stdio; from importlib.metadata import version; print('mcp', version('mcp'))"
      - name: Construct an MCP server (#105 broke at construction, not at import)
        # `import shal.mcp.server` does NOT load the SDK — the `mcp` imports live
        # inside `_build_server()` (src/shal/mcp/server.py:29-31), deliberately, to
        # keep the core at two dependencies. `--help` exits inside argparse, long
        # before a server exists. Verified locally: after `import shal.mcp.server`,
        # `"mcp" in sys.modules` is False. So neither an import nor a `--help` can
        # see an incompatible SDK; only building a server can. #105 was
        # `AttributeError: 'Server' object has no attribute 'list_tools'`, raised
        # while `_build_server` registers its handlers — which is what this runs.
        run: |
          python - <<'PY'
          import shal
          import shal.adk.reference.tmp102.driver, shal.adk.reference.tmp102.sim  # setup_sim.yaml's device (#149)
          from shal.mcp import Bridge
          from shal.mcp.server import _build_server
          print("shal", shal.__version__)
          with shal.load("tests/setup_sim.yaml") as hal:
              bridge = Bridge(hal)
              _build_server(bridge)   # registers @server.list_tools / @server.call_tool
              print("built an MCP server over", len(bridge.tool_defs()), "tools")
          PY
      - name: CLI entry points still start (argparse only — reaches no MCP code)
        run: |
          shal-mcp --help > /dev/null
          shal mcp --help > /dev/null
      - name: Test
        run: python -m pytest
