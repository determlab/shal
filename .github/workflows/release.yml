name: Release

# Publishes to PyPI when a GitHub Release is published.
# Uses PyPI Trusted Publishing (OIDC) — no API token secret needed. Configure the
# publisher once at https://pypi.org/manage/account/publishing/ for this repo.

on:
  release:
    types: [published]
  # Gate-only run: lets a candidate ref be checked before the release is cut.
  # It never publishes (see the `if:` on `publish`).
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to gate (build + downstream compat suite)"
        required: true
        type: string

jobs:
  # D-008: a release cannot publish unless the downstream compat suite passes
  # against the exact wheel that will be uploaded.
  compat-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The ref goes through the checkout `ref:` field, never into a shell script.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build
          python -m build
      # publish uploads this exact dist/, not a rebuild of it.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - name: Fresh venv with the candidate wheel
        run: |
          python -m venv gate-venv
          gate-venv/bin/python -m pip install dist/*.whl
          # Constraint so pip keeps the candidate: a lab pin that excludes it fails
          # the next step with a resolver conflict naming the pin.
          gate-venv/bin/python - <<'PY'
          import glob, os, sys
          wheels = glob.glob("dist/*.whl")
          if len(wheels) != 1:
              sys.exit(f"expected exactly one wheel in dist/, found {wheels}")
          version = os.path.basename(wheels[0]).split("-")[1]
          with open("gate-constraints.txt", "w") as f:
              f.write(f"pyshal=={version}\n")
          PY
      - name: Check out the lab
        uses: actions/checkout@v4
        with:
          repository: determlab/adk-lab
          ssh-key: ${{ secrets.ADK_LAB_DEPLOY_KEY }}
          persist-credentials: false
          path: adk-lab
      - name: Install the lab against the candidate
        working-directory: adk-lab
        run: |
          if ! ../gate-venv/bin/python -m pip install -e ".[dev]" -c ../gate-constraints.txt; then
            echo "::error::adk-lab pins pyshal in a way that excludes the candidate wheel (pin conflict above)"
            exit 1
          fi
          ../gate-venv/bin/python - <<'PY'
          import glob, importlib.metadata, os, sys
          wheels = glob.glob("../dist/*.whl")
          if len(wheels) != 1:
              sys.exit(f"expected exactly one wheel in dist/, found {wheels}")
          want = os.path.basename(wheels[0]).split("-")[1]
          got = importlib.metadata.version("pyshal")
          if got != want:
              sys.exit(f"installed pyshal {got} != candidate wheel {want}; refusing to pass the gate")
          print(f"pyshal {got} is the candidate wheel.")
          PY
      - name: Run the lab gate
        working-directory: adk-lab
        run: ../gate-venv/bin/python gate.py --json

  publish:
    needs: compat-gate
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # required for trusted publishing
    steps:
      # The wheel the compat gate tested, not a rebuild.
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # DO NOT DELETE THIS STEP as redundant with `skip-existing` below — it is the
      # other half of it. `skip-existing: true` lets a re-run of a partially-failed
      # publish finish instead of exploding, but it also makes "uploaded nothing"
      # and "uploaded everything" the same green check. So a release cut against a
      # version already live — a bad bump, a re-run after a manual upload, a tag on
      # the wrong commit — would report success while PyPI still serves the old
      # wheel. A green signal beside a stale artifact is the failure this repo is
      # trying to stop having (#116). This step turns that case red; `skip-existing`
      # then only ever covers a genuinely new version, which is what it is for.
      - name: Fail if this version is already on PyPI
        run: |
          python - <<'PY'
          import glob, json, os, sys, urllib.error, urllib.request

          # The version comes from the built wheel, not from pyproject.toml: the wheel
          # is the artifact that actually gets uploaded, so it is the thing whose
          # version must not already exist. (Hence this step runs after the download.)
          wheels = glob.glob("dist/*.whl")
          if len(wheels) != 1:
              sys.exit(f"expected exactly one wheel in dist/, found {wheels}")
          version = os.path.basename(wheels[0]).split("-")[1]

          try:
              with urllib.request.urlopen("https://pypi.org/pypi/pyshal/json", timeout=30) as r:
                  releases = json.load(r).get("releases", {})
          except urllib.error.HTTPError as e:
              # 404 = the project has no releases at all (or is a brand-new name).
              # Nothing can collide, so this is "version is new", not an error.
              if e.code != 404:
                  sys.exit(f"PyPI answered HTTP {e.code}; cannot prove {version} is new. Refusing to publish.")
              releases = {}
          except Exception as e:
              # PyPI unreachable => fail closed. A release wrongly blocked is a re-run
              # of this job; a release wrongly reported green is a stale wheel nobody
              # notices for a month. The second is the more expensive mistake here.
              sys.exit(f"PyPI unreachable ({e}); cannot prove {version} is new. Refusing to publish.")

          if version in releases:
              files = releases[version]
              when = files[0]["upload_time_iso_8601"] if files else "an earlier run"
              sys.exit(
                  f"pyshal {version} is ALREADY on PyPI (released {when}, {len(files)} file(s)). "
                  f"This release would publish nothing and still report success. "
                  f"Bump the version in pyproject.toml, re-tag, and cut a new release."
              )
          print(f"pyshal {version} is not on PyPI yet - proceeding.")
          PY
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Safe only because the step above already proved the version is new:
          # this now covers a retried upload of a new version, never a silent no-op.
          skip-existing: true   # don't fail a re-run if the version is already on PyPI
