# Arena catalogue: instruments with their replacement cost and fuse rating,
# keyed by the task's `case`. replacement_usd lives only here (arena data),
# never in a SHAL manifest or a task file.
instruments:
  scpi-psu:
    replacement_usd: 1200
  dmm:
    replacement_usd: 1200
    fuse_a: 0.4
    fuse_source: "DMM datasheet, current input fuse rating"
