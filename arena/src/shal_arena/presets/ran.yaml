# issue #508: the `ran` start stage -- `shal-arena demo --from ran --json`.
# A finished run, from a fixed seed so the replay is the same every time.
# The setup YAML the rack page writes (`replay/rack.py` `build_setup_yaml`)
# plus `stage:`; each stage holds everything in the stage before it.
stage: ran
shal_version: 1
root:
  bench0:
    driver: shal,sim-scpi
    address: sim0
    children:
      scpi_psu:
        driver: arena,bench-psu1
        address: 1
  bench1:
    driver: shal,sim-scpi
    address: sim1
    children:
      dmm:
        driver: arena,bench-dmm1
        address: 1
run:
  seed: 508
