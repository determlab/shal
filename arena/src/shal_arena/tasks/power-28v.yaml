arena_task: 1
id: power-28v
title: "Find the fault on a 28 V power module"
level: hard
card: ../cards/power-28v.yaml
instruments:
  - case: scpi-psu
    address: psu0
    drives: card.vin
  - case: dmm
    address: dmm0
    probes: [card.tp_12v, card.tp_5v, card.tp_3v3]
  - case: relay-modbus
    address: relay0
    switches: card.vin
  - case: sht31
    address: temp0
    probe: card.tp_u2_temp
question:
  text: "This 28 V power module came back from the line. Power it at 28.0 V through relay0. Is it good? If not, name the fault."
  answer: {kind: enum, values: [ok, low_5v, open_12v, low_3v3, overheat_u2]}
seed: 5
limits: {max_turns: 60, max_minutes: 30}
