# agenticQA manuscript — sonos (the SECOND device — proves device-agnosticism, issue #78)
#
# sonos playback/volume ops are @op side_effect="actuator" (they change the physical
# world — ADR-001 Addendum 6), so they are gated like deebot's. Running the SAME loop
# over sonos proves the harness is device-agnostic. (gate_exercised will be true.)
schema_version: 1
device: sonos

topology: examples/demos/sonos/sonos_sim.yaml
node: sonos                                      # tool handle "sonos__<op>"

drivers:
  - examples/demos/sonos/sonos_driver.py

liveness_reads: [get_state, get_volume]

actuation: { op: play, args: {} }

# Actuator: gated. `gated: true` is asserted against the live catalog too —
# if sonos play were downgraded to a write, this run would go RED (catalog disagrees).
expected:  { read: get_state, becomes: PLAYING, gated: true }

# A denied play leaves the speaker STOPPED.
deny_path: { stays: STOPPED }

teardown:  [stop]
