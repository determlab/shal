# A simulated SCPI rack: one programmable PSU, one DMM that reads its output
# plus small measurement noise (shal,sim-dmm, #303). No hardware, no network.
shal_version: 1
root:
  bench:
    driver: shal,sim-scpi
    address: sim0
    children:
      psu0:
        id: psu
        driver: shal,sim-psu
        address: psu0
        config:
          load_ohms: 10
          # this rack's own ceiling (shal#350): tighter than the driver's 0-30 V
          # range, so a 30 V request is rejected pre-I/O, nothing sent to the sim
          limits:
            set_voltage:
              volts: {maximum: 24.0}
      dmm0:
        id: dmm
        driver: shal,sim-dmm
        address: dmm0
        config:
          probe: psu0
