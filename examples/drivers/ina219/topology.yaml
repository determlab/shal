# One ti,ina219 on the sim I2C bus. Not a registered driver: name its files (D5):
#   shal probe topology.yaml --drivers ina219_driver.py --drivers ina219_sim.py
shal_version: 1
root:
  bench:
    id: bench
    driver: shal,sim-i2c
    address: sim0
    children:
      dev: {id: dev, driver: "ti,ina219", address: 0x40}
