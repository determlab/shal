# One microchip,mcp9808 on the sim I2C bus. Not a registered driver: name its files (D5):
#   shal probe topology.yaml --drivers mcp9808_driver.py --drivers mcp9808_sim.py
shal_version: 1
root:
  bench:
    id: bench
    driver: shal,sim-i2c
    address: sim0
    children:
      dev: {id: dev, driver: "microchip,mcp9808", address: 0x18}
