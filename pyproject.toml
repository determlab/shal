[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyshal"
version = "0.2.2"
description = "System/Software Hardware Abstraction Layer — device-tree-inspired, dynamic, user-space, network-capable"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "SHAL contributors" }]
requires-python = ">=3.10"
keywords = [
    "hardware", "hal", "device-tree", "i2c", "spi", "ssh",
    "embedded", "lab-automation", "robotics", "instrumentation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Hardware",
    "Topic :: Software Development :: Embedded Systems",
    "Typing :: Typed",
]
dependencies = [
    # Bounded at the next major, same convention as `mcp>=1.0,<2` below (#123)
    # — an unbounded floor is exactly the shape that broke `pyshal[mcp]` for
    # 34 days (#105/#106): `pip install` happily took a future major nobody
    # here had tested against.
    "pyyaml>=6.0,<7",
    "jsonschema>=4.18,<5",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0,<2",
]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "ruff>=0.4",
    "mcp>=1.0,<2",
]

[project.scripts]
shal = "shal.cli:main"
shal-mcp = "shal.mcp.server:main"   # legacy alias of `shal mcp`

[project.urls]
Documentation = "https://github.com/determlab/shal#readme"
Changelog = "https://github.com/determlab/shal/blob/main/CHANGELOG.md"
Source = "https://github.com/determlab/shal"

# The framework's own buses, discovered the same way community drivers are
# (decision 3). No device driver ships registered (D1, #149).
[project.entry-points."shal.drivers"]
"shal,sim-i2c" = "shal.buses.sim:SimI2cBus"
"shal,sim-scpi" = "shal.buses.sim_scpi:SimScpiBus"
"shal,sim-msg" = "shal.buses.sim_msg:SimMsgBus"
"shal,local" = "shal.buses.local:LocalBus"
"shal,ssh-host" = "shal.buses.ssh:SshBus"
"shal,i2c-cli" = "shal.buses.i2c_cli:I2cCliBus"
"shal,spi-cli" = "shal.buses.spi_cli:SpiCliBus"
"shal,tcp" = "shal.buses.tcp:TcpBus"
"shal,scpi-raw" = "shal.buses.scpi_raw:ScpiRawBus"
"shal,http" = "shal.buses.http_bus:HttpBus"

[tool.setuptools.packages.find]
where = ["src"]       # src/ layout — playground/ and tests/ are never packaged

[tool.setuptools.package-data]
shal = ["schema/*.json", "py.typed", "AGENT_GUIDE.md", "SDK.md",
        "adk/reference/*/*.yaml"]   # the ADK reference set: guide material, unregistered (#149)

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# compact bench-script style is intentional in the test suite
"tests/**" = ["E701", "E702"]
