# One MCP23017 on the sim I2C bus. The driver is not registered by `import shal`,
# so name its two files when you run it (D5):
#   shal tools topology.yaml --drivers driver.py --drivers sim.py
shal_version: 1
root:
  bench:
    id: bench
    driver: shal,sim-i2c
    address: sim0
    children:
      gpio:
        id: gpio
        driver: microchip,mcp23017
        address: 0x20
