# A simulated SCPI rack: one programmable PSU, one DMM that reads its output
# plus small measurement noise (shal,sim-dmm, #303). No hardware, no network.
shal_version: 1
root:
  bench:
    driver: shal,sim-scpi
    address: sim0
    children:
      psu0:
        id: psu
        driver: shal,sim-psu
        address: psu0
        config:
          load_ohms: 10
          # DUT abs max 3.6 V (fictional demo board; shal#350 CTO review): the
          # limit protects what's under test, not the driver's own 0-30 V
          # envelope — so a 5 V or 30 V request is rejected pre-I/O, nothing
          # sent to the sim
          limits:
            set_voltage:
              volts: {maximum: 3.6}
      dmm0:
        id: dmm
        driver: shal,sim-dmm
        address: dmm0
        config:
          probe: psu0
